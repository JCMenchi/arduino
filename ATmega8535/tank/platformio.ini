; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:ATmega8535]
platform = atmelavr
board = ATmega8535
upload_flags = -e
upload_protocol = usbtiny
board_build.f_cpu = 8000000L
build_flags = 
test_ignore = *

[env:debug]
build_type = debug ; adds -g2 -ggdb2 -Og to build_flags
platform = atmelavr
board = ATmega32   ; same layout as ATmega8535 but with more flash (8kB is not enough for debug build)
upload_protocol = none
board_build.f_cpu = 8000000L
build_unflags = -Os -Og  ;problematic flags
build_flags = 
  -I/usr/local/include/ -DHAS_SERIAL
  -Wl,--undefined=_mmcu,--section-start=.mmcu=0x910000
extra_scripts = simavr_env.py
debug_port = 1234
debug_tool = custom
debug_init_cmds =
  target remote :$DEBUG_PORT
  file "$PROG_PATH"
  load
