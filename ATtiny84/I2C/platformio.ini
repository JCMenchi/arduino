; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:attiny84]
platform = atmelavr
board = attiny84
#framework = arduino
build_flags =-DSOFTWARE_I2C -DHAS_INT0 -DHAS_INT0_SERIAL -DINT0_SERIAL_TRANSMIT_PORT=A

upload_flags = 
    -v
    -e
    -B1

; uncomment line below to USBtiny programmer (red sparkfun PCB USB id 1781:0c9f 1781:0c9f Multiple Vendors USBtiny )
upload_protocol = usbtiny
upload_port = /dev/ttyS0

; uncomment to use USBasp programmer (blue PCB USB id 16c0:05dc Van Ooijen Technische Informatica)
;upload_protocol = usbasp

